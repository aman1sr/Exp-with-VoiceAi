<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Voice AI Agent - Phase 0</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; }
    button { font-size: 18px; padding: 10px 24px; }
    table { margin-top: 20px; border-collapse: collapse; }
    td { padding: 6px 16px 6px 0; }
    td:last-child { font-family: monospace; }
  </style>
</head>
<body>
  <h1>Phase 0 - Audio transport</h1>
  <p>Mic -> 16kHz PCM16 -> 20ms frames -> WebSocket -> server</p>

  <button id="toggle">Start</button>

  <table>
    <tr><td>Status</td><td id="status">idle</td></tr>
    <tr><td>Frames sent</td><td id="sent">0</td></tr>
    <tr><td>Server frames/sec</td><td id="fps">-</td></tr>
    <tr><td>Server bytes/sec</td><td id="bps">-</td></tr>
    <tr><td>WebSocket RTT</td><td id="rtt">-</td></tr>
  </table>

  <script type="module" src="app.js"></script>
</body>
</html>
